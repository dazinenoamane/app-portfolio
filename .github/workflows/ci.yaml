name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dazinenoamane/app-portfolio:${{ github.sha }}

      - name: Get the GitOps repo
        uses: actions/checkout@v4
        with:
          repository: dazinenoamane/gitops-portfolio
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Update image tag
        run: |
          cd gitops

          echo "Image before update:"
          grep -n 'image' manifests/deployment.yaml

          sed -i "s|image *: ghcr.io/dazinenoamane/portfolio-app:.*|image: ghcr.io/dazinenoamane/app-portfolio:${{ github.sha }}|" manifests/deployment.yaml

          echo "Image after update:"
          grep -n 'image' manifests/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nothing to change"
          else
            git commit -m "Deploy app-portfolio ${{ github.sha }}"
            git push
          fi
